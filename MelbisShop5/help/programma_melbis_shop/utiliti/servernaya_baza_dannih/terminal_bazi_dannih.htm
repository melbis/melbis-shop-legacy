<h2 align="center">Терминал базы данных</h2>
<p>Для служебных целей возможна организация SQL- запросов к базе данных на сервере. 
  Вызвать окно терминала базы данных можно из главного окна<em> &quot;Утилиты 
  - Серверная база данных - Терминал базы данных&quot;</em>. Работа терминала 
  возможна при наличии связи с сервером.</p>
